name: Test and Build

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  wait-for-formalities:
    name: FormalityCheck
    uses: openwrt/actions-shared-workflows/.github/workflows/formal.yml@483a355b2ee8493c954e89e7a83534cd850842de

  build:
    name: Feeds Package Test Build
    needs: wait-for-formalities
    uses: openwrt/actions-shared-workflows/.github/workflows/multi-arch-test-build.yml@main
